<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #dff4cf;
        }

        .page {
            width: 80%;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #222;
        }

        .logo span {
            color: #79c900;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .contact-btn {
            padding: 10px 18px;
            border: 1px solid #ddd;
            border-radius: 25px;
            background: white;
            cursor: pointer;
        }

        .touch-btn {
            padding: 12px 22px;
            border: none;
            background: #11162c;
            color: white;
            border-radius: 25px;
            cursor: pointer;
        }

        /* Hero */
        .hero {
            position: relative;
            margin: 0 25px 25px;
            height: 520px;
            border-radius: 35px;
            overflow: hidden;

            background-image:
                linear-gradient(
                    90deg,
                    rgba(128, 220, 0, 0.85),
                    rgba(128, 220, 0, 0.30),
                    rgba(0, 0, 0, 0.05)
                ),
                url("your-photo.jpg");

            background-size: cover;
            background-position: center;
        }

        .hero-content {
            position: absolute;
            left: 40px;
            bottom: 45px;
            color: white;
            max-width: 520px;
        }

        .hero-content h1 {
            font-size: 50px;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #eeeeee;
        }

        .book-btn {
            background: white;
            color: #222;
            border: none;
            padding: 13px 22px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Client box */
        .client-box {
            position: absolute;
            right: 30px;
            bottom: 35px;
            color: white;
        }

        .people {
            display: flex;
            margin-bottom: 10px;
        }

        .person {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            background: #ddd;
            margin-right: -8px;
        }

        .plus {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #79c900;
        }

        .client-box h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .client-box p {
            font-size: 12px;
            line-height: 1.4;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .page {
                width: 95%;
            }

            .nav-links {
                display: none;
            }

            .hero {
                height: 480px;
            }

            .hero-content h1 {
                font-size: 38px;
            }
        }

        @media (max-width: 600px) {
            .page {
                width: 100%;
            }

            .navbar {
                padding: 15px;
            }

            .contact-btn {
                display: none;
            }

            .touch-btn {
                padding: 10px 15px;
            }

            .hero {
                margin: 0 15px 15px;
                height: 550px;
                border-radius: 25px;
                background-position: 60% center;
            }

            .hero-content {
                left: 20px;
                right: 20px;
                bottom: 120px;
            }

            .hero-content h1 {
                font-size: 34px;
            }

            .client-box {
                left: 20px;
                right: auto;
                bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- Navbar -->
        <nav class="navbar">

            <div class="logo">
                <span>✦</span> Execora
            </div>

            <div class="nav-links">
                <a href="#">About</a>
                <a href="#">Service</a>
                <a href="#">Case Studies</a>
                <a href="#">Articles</a>
            </div>

            <div class="nav-buttons">
                <button class="contact-btn">Contact Us</button>
                <button class="touch-btn">Get in touch</button>
            </div>

        </nav>

        <!-- Hero Section -->
        <section class="hero">

            <div class="hero-content">

                <h1>
                    Strategic Clarity<br>
                    Sustainable Growth.
                </h1>

                <p>
                    We help businesses refine strategy, strengthen operations,
                    scale with confidence through data-driven consulting
                    and practical execution.
                </p>

                <button class="book-btn">
                    Book a Call →
                </button>

            </div>

            <div class="client-box">

                <div class="people">
                    <div class="person"></div>
                    <div class="person"></div>
                    <div class="person"></div>
                    <div class="person plus">+</div>
                </div>

                <h2>30k+</h2>

                <p>
                    Happy clients we have<br>
                    worldwide.
                </p>

            </div>

        </section>

    </div>

</body>
</html>
